{% extends 'base.html' %}

{% block title %}Delete Customer - HydraVision{% endblock %}

{% block content %}
<h1>Delete Customer</h1>

<p>Are you sure you want to delete <strong>{{ customer.name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn">Yes, Delete</button>
</form>

<br>
<a href="{% url 'customer_list' %}">Cancel</a>
{% endblock %}
